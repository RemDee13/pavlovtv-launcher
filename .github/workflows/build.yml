name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PavlovTV-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    # Runs only for version tags such as v0.1.0. Needs these repository secrets:
    #   PAVLOVTV_KEYSTORE_BASE64  base64 of the release .jks file
    #   PAVLOVTV_STORE_PASSWORD, PAVLOVTV_KEY_ALIAS, PAVLOVTV_KEY_PASSWORD
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PAVLOVTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::PAVLOVTV_KEYSTORE_BASE64 is not set. Releases must be signed with the release key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PAVLOVTV_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          PAVLOVTV_STORE_PASSWORD: ${{ secrets.PAVLOVTV_STORE_PASSWORD }}
          PAVLOVTV_KEY_ALIAS: ${{ secrets.PAVLOVTV_KEY_ALIAS }}
          PAVLOVTV_KEY_PASSWORD: ${{ secrets.PAVLOVTV_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          # A fixed file name keeps .../releases/latest/download/PavlovTV.apk working.
          cp app/build/outputs/apk/release/app-release.apk PavlovTV.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: PavlovTV.apk
          generate_release_notes: true
