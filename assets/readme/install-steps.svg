<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Install PavlovTV in three steps</title>
  <desc id="desc">Step 1: download the APK from GitHub Releases. Step 2: install it on the TV. Step 3: choose PavlovTV as the Home app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B1A"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1DE9B6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1DE9B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="250" rx="26" fill="url(#bg)"/>
  <circle cx="120" cy="40" r="260" fill="url(#glowTeal)"/>
  <circle cx="1100" cy="230" r="280" fill="url(#glowViolet)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#F4F6FA">
    <!-- 1 -->
    <g transform="translate(48 40)">
      <rect width="328" height="170" rx="22" fill="url(#glassFill)" stroke="url(#rim)" stroke-width="1.5"/>
      <circle cx="44" cy="46" r="22" fill="#1DE9B6" fill-opacity="0.16" stroke="#1DE9B6" stroke-width="2"/>
      <text x="44" y="54" text-anchor="middle" font-size="22" font-weight="700" fill="#1DE9B6">1</text>
      <g transform="translate(270 22)" fill="none" stroke="#F4F6FA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
        <path d="M18 4 v24 M8 18 l10 10 l10 -10 M4 38 h28"/>
      </g>
      <text x="28" y="112" font-size="30" font-weight="700">Download</text>
      <text x="28" y="146" font-size="20" fill="#C9D4EA">the APK from GitHub Releases</text>
    </g>
    <!-- arrow -->
    <path d="M388 125 h36 M414 115 l10 10 l-10 10" fill="none" stroke="#8AB4FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 2 -->
    <g transform="translate(436 40)">
      <rect width="328" height="170" rx="22" fill="url(#glassFill)" stroke="url(#rim)" stroke-width="1.5"/>
      <circle cx="44" cy="46" r="22" fill="#8AB4FF" fill-opacity="0.16" stroke="#8AB4FF" stroke-width="2"/>
      <text x="44" y="54" text-anchor="middle" font-size="22" font-weight="700" fill="#8AB4FF">2</text>
      <g transform="translate(262 24)" fill="none" stroke="#F4F6FA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
        <rect x="2" y="2" width="40" height="26" rx="5"/>
        <path d="M16 36 h12"/>
      </g>
      <text x="28" y="112" font-size="30" font-weight="700">Install</text>
      <text x="28" y="146" font-size="20" fill="#C9D4EA">it on your TV and open it</text>
    </g>
    <!-- arrow -->
    <path d="M776 125 h36 M802 115 l10 10 l-10 10" fill="none" stroke="#8AB4FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 3 -->
    <g transform="translate(824 40)">
      <rect width="328" height="170" rx="22" fill="url(#glassFill)" stroke="url(#rim)" stroke-width="1.5"/>
      <circle cx="44" cy="46" r="22" fill="#FFC46B" fill-opacity="0.16" stroke="#FFC46B" stroke-width="2"/>
      <text x="44" y="54" text-anchor="middle" font-size="22" font-weight="700" fill="#FFC46B">3</text>
      <g transform="translate(264 20)" fill="none" stroke="#F4F6FA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
        <path d="M4 20 l18 -16 l18 16 M10 16 v20 h24 v-20"/>
      </g>
      <text x="28" y="112" font-size="30" font-weight="700">Make it Home</text>
      <text x="28" y="146" font-size="20" fill="#C9D4EA">and press Home on the remote</text>
    </g>
  </g>
</svg>
